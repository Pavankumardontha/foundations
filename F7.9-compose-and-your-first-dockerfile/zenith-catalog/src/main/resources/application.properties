# Where is the database? Default: localhost, for running directly on the Mac.
# Inside compose, the SPRING_DATASOURCE_URL environment variable overrides this
# with the service name: jdbc:postgresql://postgres:5432/zenith
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zenith}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dev}
